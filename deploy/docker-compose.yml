services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-medshift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Do not publish 5432 publicly on Oracle — remove ports in production
    ports:
      - "5432:5432"

  api:
    build:
      context: ../api
      dockerfile: ../deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-medshift};Username=${POSTGRES_USER:-medshift};Password=${POSTGRES_PASSWORD:-changeme}
      Jwt__Issuer: MedShift
      Jwt__Audience: MedShiftClients
      Jwt__Key: ${JWT_KEY:-MedShift_ChangeMe_Production_Secret_Key_Min32Chars!}
      Jwt__ExpiryMinutes: "1440"
      Firebase__Enabled: ${FIREBASE_ENABLED:-false}
      EmailSettings__Enabled: ${EMAIL_ENABLED:-false}
      PaymentGateway__Provider: Simulated
    volumes:
      - uploads:/app/wwwroot/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Optional HTTPS reverse proxy — set DOMAIN in .env and uncomment
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #   depends_on:
  #     - api
  #     - web

volumes:
  pgdata:
  uploads:
  # caddy_data:
