# Docs: https://github.com/Azure/webapps-deploy
# Monorepo: build only api/src/MedShift.Api (net9.0)

name: Build and deploy ASP.Net Core app to Azure Web App - medshift-api-demo

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/medshift-api-demo*.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: medshift-api-demo
  DOTNET_VERSION: '9.0.x'
  PROJECT: api/src/MedShift.Api/MedShift.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -o ${{ env.DOTNET_ROOT }}/myapp --no-restore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
          # ถ้า Azure สร้าง workflow ให้มาพร้อม publish-profile ให้คงบรรทัดนี้ไว้
          # (ชื่อ secret อาจเป็น AZURE_WEBAPP_PUBLISH_PROFILE ตามที่ Deployment Center สร้าง)
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
